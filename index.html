<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        var isWsNotice = function(msg) {
          if (!msg) return false;
          var s = (typeof msg === 'string') ? msg : (msg.message || msg.stack || String(msg));
          return (
            s.indexOf('WebSocket') !== -1 ||
            s.indexOf('websocket') !== -1 ||
            s.indexOf('[vite] failed to connect to websocket') !== -1 ||
            s.indexOf('WebSocket closed without opened') !== -1 ||
            s.indexOf('[vite]') !== -1 ||
            s.indexOf('vite') !== -1
          );
        };

        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var fullMsg = args.map(function(a) {
            return (a && (a.message || a.stack)) ? (a.message || a.stack) : String(a);
          }).join(' ');
          if (isWsNotice(fullMsg)) return;
          return origConsoleError.apply(console, arguments);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var fullMsg = args.map(function(a) {
            return (a && (a.message || a.stack)) ? (a.message || a.stack) : String(a);
          }).join(' ');
          if (isWsNotice(fullMsg)) return;
          return origConsoleWarn.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function (e) {
          var reason = e.reason;
          if (isWsNotice(reason)) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return false;
          }
        }, true);

        window.addEventListener('error', function (e) {
          if (isWsNotice(e.message) || isWsNotice(e.error)) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return false;
          }
        }, true);

        // Intercept native WebSocket to silently handle Vite dev HMR in container environments
        if (typeof window.WebSocket !== 'undefined') {
          var OrigWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            var listeners = {};
            var mockWs = {
              url: urlStr,
              readyState: 1, // WebSocket.OPEN
              bufferedAmount: 0,
              extensions: '',
              protocol: Array.isArray(protocols) ? protocols[0] : (protocols || 'vite-hmr'),
              binaryType: 'blob',
              send: function() {},
              close: function() {},
              addEventListener: function(evt, fn) {
                if (!listeners[evt]) listeners[evt] = [];
                listeners[evt].push(fn);
                if (evt === 'open') {
                  setTimeout(function() {
                    try { fn({ type: 'open', target: mockWs }); } catch (e) {}
                  }, 0);
                }
              },
              removeEventListener: function(evt, fn) {
                if (!listeners[evt]) return;
                listeners[evt] = listeners[evt].filter(function(f) { return f !== fn; });
              },
              dispatchEvent: function() { return true; },
              onopen: null,
              onmessage: null,
              onerror: null,
              onclose: null,
            };

            setTimeout(function() {
              if (typeof mockWs.onopen === 'function') {
                try { mockWs.onopen({ type: 'open', target: mockWs }); } catch (e) {}
              }
            }, 0);

            return mockWs;
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }
      })();
    </script>
